name: LLM Multiroute CI

on:
  push:
    branches: [main, master]
    paths:
      - 'llmapp09/llm-multiroute/**'
      - 'llmapp09/.github/workflows/llm-multiroute-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'llmapp09/llm-multiroute/**'
      - 'llmapp09/.github/workflows/llm-multiroute-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: llmapp09/llm-multiroute

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: llmapp09/llm-multiroute/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: llm-multiroute/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: <<Dockerhub_id>>/llm-multiroute #***docker hub id required
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: llmapp09/llm-multiroute
          load: true
          tags: <<Dockerhub_id>>/llm-multiroute:scan #***docker hub id required
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: <<Dockerhub_id>>/llm-multiroute:scan #***docker hub id required
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      - name: Login to Docker Hub  #Docker Hub login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: darryl1975 #***docker hub id required
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: llmapp09/llm-multiroute
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
